<body>
<div class="desktop login-desktop">
  <div class="window login-window" id="loginWin">
    <div class="title-bar">
      <div class="title-bar-text">
        <svg class="ico" viewBox="0 0 16 16"><rect x="2" y="6" width="7" height="8" fill="#e8b100" stroke="#000"/><rect x="4" y="3" width="6" height="4" rx="2" fill="none" stroke="#c0c0c0" stroke-width="1.4"/><circle cx="5.5" cy="10" r="1.2" fill="#000"/></svg>
        Enter Password
      </div>
      <div class="title-bar-controls">
        <button class="tbc" data-deco title="Minimize"><svg viewBox="0 0 8 8"><rect x="0" y="6" width="7" height="2" fill="#000"/></svg></button>
        <button class="tbc" data-deco title="Help"><b style="font-size:11px">?</b></button>
        <button class="tbc" data-deco title="Close"><svg viewBox="0 0 8 8"><path d="M0 0l8 8M8 0L0 8" stroke="#000" stroke-width="1.3"/></svg></button>
      </div>
    </div>
    <div class="window-body login-body">
      <div class="login-banner">
        <div class="flag" aria-hidden="true"><i class="r"></i><i class="g"></i><i class="b"></i><i class="y"></i></div>
        <div class="brand-text">
          <span class="ms">Microsoft</span>
          <span class="big">Windows<b>99</b></span>
          <span class="sub">Neptune Build</span>
        </div>
      </div>

      <div class="login-fields">
        <div class="field-row">
          <label for="user">User name:</label>
          <input id="user" class="text9" value="admin" autocomplete="username" spellcheck="false">
        </div>
        <div class="field-row">
          <label for="pass">Password:</label>
          <input id="pass" class="text9" type="password" autocomplete="current-password" autofocus>
        </div>
        <div class="field-row checkbox-row">
          <label class="chk9 dim"><input type="checkbox" disabled> Log on using dial-up connection</label>
        </div>
      </div>

      <div class="login-buttons">
        <button class="btn9" id="okBtn">OK</button>
        <button class="btn9" id="cancelBtn">Cancel</button>
        <button class="btn9" id="guestBtn">Login as guest</button>
      </div>
    </div>
  </div>
</div>

<!-- error dialog -->
<div class="dialog-overlay" id="errDlg">
  <div class="window err-window">
    <div class="title-bar">
      <div class="title-bar-text">
        <svg class="ico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#d00" stroke="#000"/><path d="M5 5l6 6M11 5l-6 6" stroke="#fff" stroke-width="1.6"/></svg>
        Enter Password
      </div>
      <div class="title-bar-controls"><button class="tbc" id="errX"><svg viewBox="0 0 8 8"><path d="M0 0l8 8M8 0L0 8" stroke="#000" stroke-width="1.3"/></svg></button></div>
    </div>
    <div class="window-body err-body">
      <div class="err-top">
        <div class="err-ico">✕</div>
        <p id="errMsg" style="margin:0">The password you entered is incorrect. Please try again.</p>
      </div>
      <div class="button-row center"><button class="btn9" id="errOk">OK</button></div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ----------------------------------------------------------
   Login gate. The admin password is NOT stored in this file —
   only a PBKDF2-SHA256 hash of it is. On submit we derive the
   same hash from what was typed and compare.
   NOTE: this is a convenience gate, not real security. The
   admin page is a separate static file that can be opened
   directly, so treat this as a lock on the front door, not a
   vault. Real protection needs a server, which static hosting
   (Neocities) can't provide.
   ---------------------------------------------------------- */
const AUTH = {
  user: "admin",
  salt: "sacta::neptune99::v1",
  iters: 120000,
  hash: "6e86ef01a595406fcbd3a4e8dc0a5ac98e4900327e9c1fb6fe629ba895c56917"                 // PBKDF2(pw, salt, iters, SHA-256) as hex
};
const ADMIN_URL = "sacta.html";
const GUEST_URL = "guest.html";

const $=s=>document.querySelector(s);

function toHex(buf){return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");}
async function derive(pw){
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey("raw",enc.encode(pw),{name:"PBKDF2"},false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits(
    {name:"PBKDF2",salt:enc.encode(AUTH.salt),iterations:AUTH.iters,hash:"SHA-256"},key,256);
  return toHex(bits);
}
function shake(){const w=$("#loginWin");w.classList.remove("shake");void w.offsetWidth;w.classList.add("shake");}
function showErr(msg){$("#errMsg").textContent=msg||"The password you entered is incorrect. Please try again.";$("#errDlg").classList.add("open");}
function hideErr(){$("#errDlg").classList.remove("open");$("#pass").value="";$("#pass").focus();}

async function tryLogin(){
  const u=($("#user").value||"").trim().toLowerCase();
  const p=$("#pass").value||"";
  if(u!==AUTH.user){shake();showErr("Unknown user name. Only ‘admin’ can log in here.");return;}
  let ok=false;
  try{ ok=(await derive(p))===AUTH.hash; }
  catch(e){ showErr("This browser blocked secure hashing. Open the page over https and try again."); return; }
  if(ok){ location.href=ADMIN_URL; }
  else { shake(); showErr("The password you entered is incorrect. Please try again."); }
}

$("#okBtn").onclick=tryLogin;
$("#pass").addEventListener("keydown",e=>{if(e.key==="Enter")tryLogin();});
$("#user").addEventListener("keydown",e=>{if(e.key==="Enter")$("#pass").focus();});
$("#guestBtn").onclick=()=>{ location.href=GUEST_URL; };
$("#cancelBtn").onclick=()=>{ $("#pass").value=""; $("#user").value="admin"; $("#pass").focus(); };
$("#errOk").onclick=hideErr;
$("#errX").onclick=hideErr;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#errDlg").classList.contains("open"))hideErr();});
document.querySelectorAll("[data-deco]").forEach(b=>b.onclick=e=>e.preventDefault());
</script>
</body>
</html>
